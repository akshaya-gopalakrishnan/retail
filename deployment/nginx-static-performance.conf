# Include inside the production Nginx server block, ahead of a general
# regex location for static files. Review the root for the deployment host.
# This handles public, content-hashed build assets only.
# Private files, HTML and API responses keep the existing Bench configuration.
location ~ ^/assets/(frappe|erpnext|hrms|retail)/dist/(js|css|css-rtl)/.+\.bundle\.[A-Za-z0-9]+\.(js|css)$ {
    root /home/adler/frappe-bench/sites;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript;
}
